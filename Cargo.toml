[package]
name = "spidy"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
constcat = "0.6"
curl = "0.4"
parse-size = "1"
indicatif = "0.18"
tabwriter = "1"
console = { version = "0.16", default-features = false, features = [
  "ansi-parsing",
  "std",
] }
